<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dashboard Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;--pr:#2563eb;--pr-d:#1d4ed8;--pr-s:#eaf1ff;--side:#2f6bef;--out:#2f6bef;--panel:#fff;--bg:#f4f5f7;--card:#fff;--tx:#0f172a;--mu:#6b7280;--bd:#e6e8ec;--in:#fff;--dg:#dc2626;--ok:#16a34a;--ok-s:#e7f7ee;--sh:0 1px 2px rgba(16,24,40,.04),0 4px 14px rgba(16,24,40,.05);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--pr:#6b9bff;--pr-d:#5a8af0;--pr-s:#2d3038;--side:#0f0f11;--out:#0f0f11;--panel:#1a1a1d;--bg:#242427;--card:#2c2c30;--tx:#ececee;--mu:#9b9ba3;--bd:#3b3b41;--in:#212124;--dg:#f87171;--ok:#4ade80;--ok-s:#1d3326}}
:root[data-theme="dark"]{--pr:#6b9bff;--pr-d:#5a8af0;--pr-s:#2d3038;--side:#0f0f11;--out:#0f0f11;--panel:#1a1a1d;--bg:#242427;--card:#2c2c30;--tx:#ececee;--mu:#9b9ba3;--bd:#3b3b41;--in:#212124;--dg:#f87171;--ok:#4ade80;--ok-s:#1d3326}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--out)}
body{margin:0;overflow-x:hidden;font-size:15px;background:var(--out);color:var(--tx);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;min-height:42px;padding:0 16px;border-radius:99px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer;font-weight:600;font-size:14px}
button:hover{background:var(--pr-s)}button:active{opacity:.75}button:disabled{opacity:.5}
button.p{background:var(--pr);color:#fff;border-color:var(--pr)}button.p:hover{background:var(--pr-d)}
button.g{background:var(--pr-s);color:var(--pr);border-color:transparent}
button.s{min-height:34px;padding:0 13px;font-size:13px}
input,select{width:100%;font:inherit;font-size:16px;min-height:44px;padding:0 14px;border:1px solid var(--bd);border-radius:12px;background:var(--in);color:var(--tx)}
input:focus,select:focus{outline:2px solid var(--pr);outline-offset:-1px;border-color:var(--pr)}
label{display:block;font-size:12px;font-weight:600;color:var(--mu);margin-bottom:5px}
.sub{color:var(--mu);font-size:13px}
.shell{display:flex;min-height:100vh;min-height:100dvh}
.side{width:224px;flex:none;padding:24px 0 20px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;height:100dvh;color:#fff;background:var(--side)}
.logo{font-size:21px;font-weight:800;letter-spacing:.04em;line-height:1.1;padding:0 14px 22px 12px;color:#fff}
.logo small{display:block;font-size:11px;font-weight:500;opacity:.8;letter-spacing:.06em;margin-top:5px}
.nv{display:flex;align-items:center;gap:12px;width:100%;min-height:46px;padding:0 18px;border:0;background:none;color:rgba(255,255,255,.92);font-size:14px;font-weight:500;border-radius:16px 0 0 16px;text-align:left}
.nv:hover{background:rgba(255,255,255,.12)}
.nv.on{background:var(--panel);color:var(--pr);font-weight:700}
.nv svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.mh{display:none}
.main{flex:1;min-width:0;background:var(--panel);margin:12px 12px 12px 0;border-radius:24px;padding:12px}
.in{background:var(--bg);border-radius:18px;padding:20px;min-height:calc(100vh - 48px)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.top h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.01em}
.usr{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:99px;padding:5px 14px 5px 5px;font-size:13px}
.av{width:30px;height:30px;border-radius:50%;background:var(--pr);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.usr .em{color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px}
.usr a{color:var(--pr);font-weight:700;text-decoration:none;white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.sc{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px 16px;box-shadow:var(--sh)}
.sc .l{font-size:13px;color:var(--mu);font-weight:600}
.sc .n{font-size:30px;font-weight:800;margin-top:8px;line-height:1}
.sc .s{font-size:12px;color:var(--mu);margin-top:7px}
.sc.hl{background:linear-gradient(135deg,#3b7bff,#1d4ed8);color:#fff;border-color:transparent}
.sc.hl .l,.sc.hl .s{color:rgba(255,255,255,.82)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-top:14px;box-shadow:var(--sh)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}
.srch{position:relative;flex:1 1 240px}
.srch svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--mu);fill:none;stroke-width:2;stroke-linecap:round;pointer-events:none}
.srch input{padding-left:38px;border-radius:99px;background:var(--card)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:14px}
.cb{text-align:left;display:block;width:100%;min-height:0;padding:16px;border-radius:16px;background:var(--card);border:1px solid var(--bd);box-shadow:var(--sh);font-weight:400}
.cb:hover{border-color:var(--pr);background:var(--card)}
.cb b{display:block;font-size:16px;margin-bottom:4px;word-break:break-word}
.cb .m{font-size:13px;color:var(--mu);line-height:1.5}
.cb .t{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:12px}
.bd{font-size:12px;font-weight:700;border-radius:99px;padding:4px 10px;background:var(--pr-s);color:var(--pr);white-space:nowrap}
.bd.ok{background:var(--ok-s);color:var(--ok)}
.bd.no{background:var(--bg);color:var(--mu)}
.mo{font-size:13px;font-weight:700;color:var(--mu);margin:18px 0 8px;text-transform:uppercase;letter-spacing:.04em}
.hi{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 14px;border:1px solid var(--bd);border-radius:14px;margin-bottom:8px;background:var(--card)}
.hn{min-width:0;flex:1 1 220px}.hn b{display:block;word-break:break-word}.hn small{color:var(--mu)}
.act{display:flex;gap:6px;flex-wrap:wrap}
.empty{padding:36px 16px;text-align:center;color:var(--mu);line-height:1.5}
.bk{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(8px);background:#0f172a;color:#fff;padding:11px 18px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:99;max-width:92vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
.ov{position:fixed;inset:0;background:rgba(15,23,42,.5);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.ov.on{display:flex}
#lg{background:radial-gradient(900px 520px at 50% -8%,rgba(0,0,0,.07),transparent 62%),#f5f5f7;backdrop-filter:none}
#lg .md{max-width:380px;padding:34px 28px 28px;border-radius:26px;background:#fff;border:1px solid #e7e7ea;box-shadow:0 30px 70px -28px rgba(0,0,0,.28)}
#lg h3{text-align:center;font-size:23px;margin:0 0 6px;letter-spacing:-.015em}
#lg .sub{text-align:center;margin-bottom:22px}
#lg input{min-height:48px;border-radius:14px;background:transparent}
#lg input:focus{outline:none;border-color:var(--tx);box-shadow:0 0 0 3px rgba(127,127,127,.22)}
#lg button.p{min-height:48px;font-size:15px;background:#111;border-color:#111;color:#fff}
#lg button.p:hover{background:#000}
.lgm{width:48px;height:48px;border-radius:15px;background:#111;color:#fff;display:grid;place-items:center;margin:0 auto 18px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #lg{background:radial-gradient(900px 520px at 50% -8%,rgba(255,255,255,.09),transparent 62%),#09090b}
:root:not([data-theme="light"]) #lg .md{background:#131316;border-color:#26262b;box-shadow:0 30px 80px -30px rgba(0,0,0,.9)}
:root:not([data-theme="light"]) #lg button.p{background:#fff;border-color:#fff;color:#111}
:root:not([data-theme="light"]) #lg button.p:hover{background:#e4e4e7}
:root:not([data-theme="light"]) .lgm{background:#fff;color:#111}}
:root[data-theme="dark"] #lg{background:radial-gradient(900px 520px at 50% -8%,rgba(255,255,255,.09),transparent 62%),#09090b}
:root[data-theme="dark"] #lg .md{background:#131316;border-color:#26262b}
:root[data-theme="dark"] #lg button.p{background:#fff;border-color:#fff;color:#111}
:root[data-theme="dark"] .lgm{background:#fff;color:#111}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.ov.on .md{animation:rise .28s ease both}
button:focus-visible{outline:2px solid var(--pr);outline-offset:2px}
.md{background:var(--card);color:var(--tx);border-radius:22px;padding:22px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.md h3{margin:0 0 12px;font-size:18px}
.md .f{margin-bottom:12px}
.md .er{color:var(--dg);font-size:13px;min-height:18px;margin-bottom:6px}
.brand{font-size:22px;font-weight:800;letter-spacing:.04em;color:var(--pr)}
.md .bt{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.md p{line-height:1.5;margin:0 0 12px}
.ok2{margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--ok-s);color:var(--tx);font-size:14px;line-height:1.6;word-break:break-all}
.fr{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:820px){.fr{grid-template-columns:1fr}}
/* penampil laporan */
#vw{display:none;position:fixed;inset:0;background:#8a8f99;overflow:auto;z-index:40}
#vw.on{display:block}
.tb{position:sticky;top:0;background:var(--side);padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;z-index:2}
.tb button{flex:0 0 auto;background:#fff;color:#111;border-color:#fff}
.tb button.p{background:#0f172a;color:#fff;border-color:#0f172a}
.tb .tt{flex:1 1 160px;color:#fff;font-weight:700;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#vf{display:none;width:100%;height:calc(100vh - 66px);border:0;background:#fff}
#vw.pdfm #vf{display:block}
#vw.pdfm .pgw{display:none}
.pgw{padding:16px 0 40px;display:flex;justify-content:center}
.note{background:#fff7e0;color:#6b5200;font-size:13px;padding:8px 14px;text-align:center}
.paper{width:210mm;min-height:297mm;background:#fff;color:#000;padding:16mm 14mm;box-shadow:0 2px 14px rgba(0,0,0,.5);font-family:Arial,Helvetica,sans-serif;flex:none}
.paper h2{text-align:center;font-size:18pt;margin:0 0 4mm;letter-spacing:.05em}
.info{font-size:11pt;margin-bottom:5mm}
.info div{display:flex}.info span{width:26mm}
table.rp{width:100%;border-collapse:collapse;font-size:10pt}
.rp th,.rp td{border:1px solid #000;padding:4px 6px}
.rp th{background:#e6e6e6;text-align:center}
.rp td{height:8mm}.rp td.c{text-align:center}.rp td.r{text-align:right}
.rp tr{page-break-inside:avoid}
.rp thead{display:table-header-group}
.br{text-align:center;font-weight:700;font-size:13pt;letter-spacing:.2em;margin-bottom:2mm}
.ttd{display:flex;justify-content:space-between;margin-top:14mm;font-size:10pt;text-align:center}
.ttd div{width:50mm}.ttd i{display:block;height:20mm}
@page{size:A4;margin:0}
@media print{
 html,body{background:#fff!important}
 #app,#toast,.ov,.tb,#vf,.note{display:none!important}
 #vw,#vw.on{position:static;display:block!important;background:#fff;overflow:visible}
 #vw .pgw,#vw.pdfm .pgw{display:block!important;padding:0}
 .paper{zoom:1!important;box-shadow:none;width:auto;min-height:0;padding:14mm}
}
@media (max-width:820px){
 .shell{flex-direction:column}
 .side{position:fixed;left:0;right:0;bottom:0;top:auto;width:auto;height:auto;flex-direction:row;gap:4px;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));z-index:30;box-shadow:0 -4px 20px rgba(0,0,0,.15)}
 .side .logo{display:none}
 .nv{flex:1;flex-direction:column;justify-content:center;gap:3px;min-height:52px;padding:0 4px;font-size:11px;border-radius:14px;text-align:center}
 .mh{display:block;padding:18px 20px 22px;color:#fff}.mh .logo{padding:0}
 .main{margin:0;border-radius:24px 24px 0 0;padding:8px 8px 0}
 .in{border-radius:18px 18px 0 0;padding:14px 12px calc(96px + env(safe-area-inset-bottom,0px));min-height:calc(100vh - 80px)}
 .top h1{font-size:22px}
 .usr .em{display:none}.usr{padding-right:12px}
 .stats{grid-template-columns:repeat(2,1fr);gap:10px}
 .sc .n{font-size:26px}
 .tb button{flex:1 1 auto}
}
#boot{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:#f5f5f7}
#boot i{width:30px;height:30px;border-radius:50%;border:3px solid rgba(127,127,127,.3);border-top-color:#111;animation:bs .8s linear infinite}
@keyframes bs{to{transform:rotate(360deg)}}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #boot{background:#09090b}:root:not([data-theme="light"]) #boot i{border-top-color:#fff}}
:root[data-theme="dark"] #boot{background:#09090b}
:root[data-theme="dark"] #boot i{border-top-color:#fff}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
</head>
<body>
<div id="app" class="shell" style="display:none">
 <div class="mh"><div class="logo">DEAR CROFFLE<small>Dashboard Admin</small></div></div>
 <nav class="side">
  <div class="logo">DEAR CROFFLE<small>Dashboard Admin</small></div>
  <button class="nv on" data-v="home"><svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/></svg><span>Laporan</span></button>
  <button class="nv" data-v="cbg"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6M19 8v6M16 11h6"/></svg><span>Kelola Cabang</span></button>
 </nav>
 <main class="main"><div class="in">
  <header class="top">
   <div><h1 id="ttl">Semua Cabang</h1><div class="sub" id="sub"></div></div>
   <div class="usr"><span class="av" id="av"></span><span class="em" id="usr"></span><a href="#" id="bOut">Keluar</a></div>
  </header>

  <section id="home">
   <div class="stats">
    <div class="sc hl"><div class="l">Total Cabang</div><div class="n" id="sC">0</div><div class="s">Yang pernah mengirim laporan</div></div>
    <div class="sc"><div class="l">Lapor Hari Ini</div><div class="n" id="sT">0</div><div class="s" id="sTs"></div></div>
    <div class="sc"><div class="l">Belum Lapor</div><div class="n" id="sB">0</div><div class="s">Hari ini</div></div>
    <div class="sc"><div class="l">Total Laporan</div><div class="n" id="sL">0</div><div class="s" id="sLs"></div></div>
   </div>
   <div class="tools"><div class="srch"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input type="search" id="cari" placeholder="Cari cabang…" aria-label="Cari cabang"></div></div>
   <div class="grid" id="grid"></div>
  </section>

  <section id="det" style="display:none">
   <div class="bk"><button class="g" id="bBack">← Semua cabang</button><div style="flex:1 1 180px;max-width:240px;margin-left:auto"><select id="mon" aria-label="Filter bulan"></select></div></div>
   <div id="list"></div>
  </section>

  <section id="cbg" style="display:none">
   <div class="card" style="margin-top:0">
    <h3 style="margin:0 0 4px;font-size:16px">Tambah Cabang</h3>
    <div class="fr">
     <div><label for="cN">Nama cabang</label><input id="cN" placeholder="Nama cabang" autocomplete="off"></div>
     <div><label for="cE">Email akun cabang</label><input id="cE" type="email" placeholder="cabang@email.com" autocomplete="off"></div>
     <div><label for="cP">Kata sandi (min. 6 karakter)</label><input id="cP" type="text" autocomplete="off"></div>
    </div>
    <div class="er" id="cEr" style="color:var(--dg);font-size:13px;min-height:18px;margin-top:8px"></div>
    <button class="p" id="cB">Buat Cabang &amp; Akun</button>
    <div id="cOk"></div>
   </div>
   <div class="card"><h3 style="margin:0 0 12px;font-size:16px">Daftar Cabang</h3><div id="cbl"></div></div>
  </section>
 </div></main>
</div>

<div id="vw">
 <div class="tb"><button id="vK">← Kembali</button><span class="tt" id="vT"></span><button class="p" id="vD">Unduh PDF</button><button id="vP">Cetak</button></div>
 <div class="note" id="vN" style="display:none"></div>
 <iframe id="vf" title="Laporan PDF"></iframe>
 <div class="pgw"><div class="paper" id="paper"></div></div>
</div>

<div id="boot"><i></i></div>
<div class="ov" id="lg"><div class="md"><div class="lgm"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2.5"/><path d="M8 11V8a4 4 0 018 0v3"/></svg></div><h3>Masuk Admin</h3><p class="sub" id="lgN" style="margin-top:0">Gunakan akun admin.</p><div class="f"><label for="lgE">Email</label><input id="lgE" type="email" autocomplete="username" placeholder="nama@email.com"></div><div class="f"><label for="lgP">Kata sandi</label><input id="lgP" type="password" autocomplete="current-password" placeholder="••••••••"></div><div class="er" id="lgEr"></div><button class="p" id="lgB" style="width:100%">Masuk</button></div></div>
<div class="ov" id="ov"><div class="md" id="md"></div></div>
<div id="toast"></div>

<script>
(function(){
var $=function(i){return document.getElementById(i)};
function hideBoot(){var b=document.getElementById('boot');if(b)b.style.display='none'}
var authDone=false;setTimeout(function(){if(!authDone){hideBoot();var l=document.getElementById('lg');if(l)l.className='ov on'}},8000);
var auth=null,db=null,unsub=null,unsubCb=null,ALL=[],CB=[],G={},curC=null,blobUrl='',curR=null,view='home';
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function num(v){var n=parseFloat(v);return isNaN(n)?0:n}
function fmt(n){return n.toLocaleString('id-ID',{maximumFractionDigits:3})}
function cv(v){return v!=null&&v!==''?fmt(num(v)):''}
function pad(n){return String(n).padStart(2,'0')}
function todayS(){var n=new Date();return n.getFullYear()+'-'+pad(n.getMonth()+1)+'-'+pad(n.getDate())}
function dObj(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function tglID(s){return dObj(s).toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}
function tglS(s){return dObj(s).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'})}
function blnID(m){var p=m.split('-');return new Date(+p[0],+p[1]-1,1).toLocaleDateString('id-ID',{month:'long',year:'numeric'})}
function jam(t){return new Date(t).toLocaleString('id-ID',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}
function toast(t){var e=$('toast');e.textContent=t;e.className='on';clearTimeout(toast.t);toast.t=setTimeout(function(){e.className=''},2000)}

/* ----- pengelompokan per cabang ----- */
function group(){G={};
 CB.forEach(function(c){G[c.id]={id:c.id,name:c.nama||'(tanpa nama)',list:[],cb:c}});
 ALL.forEach(function(r){var g=G[r.cabId]=G[r.cabId]||{id:r.cabId,name:r.cab,list:[]};g.list.push(r)});
 Object.keys(G).forEach(function(k){var g=G[k];g.list.sort(function(a,b){return a.tgl<b.tgl?1:a.tgl>b.tgl?-1:(b.saved||0)-(a.saved||0)});
  if(g.cb)g.name=g.cb.nama||g.name;else if(g.list.length)g.name=g.list[0].cab||g.name})}
function sortedG(){return Object.keys(G).map(function(k){return G[k]}).sort(function(a,b){return String(a.name).localeCompare(String(b.name),'id')})}
function refresh(){group();if(view==='cbg')renderCbg();else if(view==='det'&&curC){buildMon();renderDet()}else renderHome()}
function renderHome(){
 var t=todayS(),gs=sortedG().filter(function(g){return!g.cb||g.cb.active!==false||g.list.length}),q=$('cari').value.trim().toLowerCase(),done=0;
 gs.forEach(function(g){if(g.list.some(function(r){return r.tgl===t}))done++});
 $('sC').textContent=gs.length;$('sT').textContent=done;$('sTs').textContent=gs.length?'dari '+gs.length+' cabang':'';
 $('sB').textContent=gs.length-done;$('sL').textContent=ALL.length;
 $('sLs').textContent=ALL.length?'Terakhir masuk '+jam(ALL[0].saved):'';
 $('sub').textContent=tglID(t);
 var h=gs.filter(function(g){return!q||String(g.name).toLowerCase().indexOf(q)>=0}).map(function(g){
  var ok=g.list.some(function(r){return r.tgl===t}),l=g.list[0];
  return'<button class="cb" data-id="'+esc(g.id)+'"><b>'+esc(g.name)+'</b><div class="m">'+(l?'Laporan terakhir: '+esc(tglS(l.tgl))+'<br>Dikirim '+esc(jam(l.saved)):'Belum ada laporan masuk')+'</div><div class="t"><span class="bd">'+g.list.length+' laporan</span><span class="bd '+(ok?'ok':'no')+'">'+(ok?'Sudah lapor hari ini':'Belum lapor hari ini')+'</span></div></button>'}).join('');
 $('grid').innerHTML=h||'<div class="empty" style="grid-column:1/-1">'+(gs.length?'Cabang tidak ditemukan.':'Belum ada cabang. Buka menu Kelola Cabang untuk menambahkan cabang dan akunnya.')+'</div>'}
$('cari').addEventListener('input',renderHome);
$('grid').addEventListener('click',function(e){var b=e.target.closest('.cb');if(b)openCab(b.getAttribute('data-id'))});

function showView(v){view=v;
 $('home').style.display=v==='home'?'':'none';$('det').style.display=v==='det'?'':'none';$('cbg').style.display=v==='cbg'?'':'none';
 Array.prototype.forEach.call(document.querySelectorAll('.nv'),function(b){b.className='nv'+(b.getAttribute('data-v')===(v==='det'?'home':v)?' on':'')});
 if(v==='home'){curC=null;$('ttl').textContent='Semua Cabang';renderHome()}
 else if(v==='cbg'){curC=null;$('ttl').textContent='Kelola Cabang';$('sub').textContent='Tambah cabang dan buat akun login untuk setiap cabang';renderCbg()}
 window.scrollTo(0,0)}
function openCab(id){curC=id;showView('det');buildMon();renderDet()}
function backHome(){showView('home')}
$('bBack').onclick=backHome;
Array.prototype.forEach.call(document.querySelectorAll('.nv'),function(b){b.onclick=function(){showView(b.getAttribute('data-v'))}});
function buildMon(){var g=G[curC],cur=$('mon').value,ms=[];
 if(g)g.list.forEach(function(r){var m=r.tgl.slice(0,7);if(ms.indexOf(m)<0)ms.push(m)});
 $('mon').innerHTML='<option value="">Semua bulan</option>'+ms.map(function(m){return'<option value="'+m+'">'+esc(blnID(m))+'</option>'}).join('');
 if(ms.indexOf(cur)>=0)$('mon').value=cur}
$('mon').onchange=renderDet;
function renderDet(){
 var g=G[curC];if(!g){$('ttl').textContent='Cabang';$('sub').textContent='';$('list').innerHTML='<div class="empty">Belum ada laporan untuk cabang ini.</div>';return}
 $('ttl').textContent=g.name;$('sub').textContent=g.list.length+' laporan PDF';
 var m=$('mon').value,last='',h='';
 g.list.forEach(function(r){if(m&&r.tgl.slice(0,7)!==m)return;
  var mm=r.tgl.slice(0,7);if(mm!==last){last=mm;h+='<div class="mo">'+esc(blnID(mm))+'</div>'}
  h+='<div class="hi" data-id="'+esc(r.id)+'"><div class="hn"><b>'+esc(tglID(r.tgl))+'</b><small>Oleh '+esc(r.by||'-')+' · dikirim '+esc(jam(r.saved))+'</small></div><div class="act"><button class="s p" data-a="v">Lihat PDF</button><button class="s" data-a="d">Unduh</button></div></div>'});
 $('list').innerHTML=h||'<div class="empty">'+(g.list.length?'Tidak ada laporan pada bulan ini.':'Cabang ini belum mengirim laporan.')+'</div>'}
$('list').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;
 var id=b.closest('.hi').getAttribute('data-id'),r=ALL.filter(function(x){return x.id===id})[0];if(!r)return;
 if(b.getAttribute('data-a')==='v')openV(r);else getPdf(r,function(url){if(url)dl(url,r);else toast('File PDF tidak tersedia, buka laporan lalu pilih Cetak')})});

/* ----- penampil PDF ----- */
function b64url(b){var bin=atob(b),n=bin.length,u=new Uint8Array(n);for(var i=0;i<n;i++)u[i]=bin.charCodeAt(i);return URL.createObjectURL(new Blob([u],{type:'application/pdf'}))}
/* PDF dibuat langsung dari data laporan, sehingga semua laporan lama ikut memakai format terbaru */
function makePdf(r){
 try{
  if(!window.jspdf||!window.jspdf.jsPDF)return'';
  var doc=new window.jspdf.jsPDF({unit:'mm',format:'a4'});
  if(typeof doc.autoTable!=='function')return'';
  doc.setFont('helvetica','bold');doc.setFontSize(13);doc.text('DEAR CROFFLE',105,16,{align:'center'});
  doc.setFontSize(17);doc.text('LAPORAN STOK BARANG',105,25,{align:'center'});
  doc.setFont('helvetica','normal');doc.setFontSize(11);
  doc.text('Tanggal',14,36);doc.text(': '+tglID(r.tgl),40,36);
  doc.text('Cabang',14,42);doc.text(': '+(r.cab||'-'),40,42);
  var body=(r.rows||[]).map(function(x,i){return[String(i+1),x.n,x.s,cv(x.a),cv(x.m),cv(x.k)]});
  doc.autoTable({startY:48,head:[['No','Nama Barang','Satuan','Stok Awal','Stok Masuk','Stok Keluar']],body:body,theme:'grid',
   styles:{fontSize:10,cellPadding:2,lineColor:[0,0,0],lineWidth:.2,textColor:[0,0,0],minCellHeight:8,valign:'middle'},
   headStyles:{fillColor:[230,230,230],textColor:[0,0,0],halign:'center'},
   columnStyles:{0:{halign:'center',cellWidth:10},2:{halign:'center',cellWidth:18},3:{halign:'right'},4:{halign:'right'},5:{halign:'right'}}});
  return URL.createObjectURL(doc.output('blob'))
 }catch(e){return''}}
function getPdf(r,cb){cb(makePdf(r))}
function dl(url,r){var a=document.createElement('a');a.href=url;a.download='Laporan-'+String(r.cab).replace(/[^\w\-]+/g,'_')+'-'+r.tgl+'.pdf';document.body.appendChild(a);a.click();a.remove()}
function paperH(r){
 var rows=(r.rows||[]).map(function(x,i){
  return'<tr><td class="c">'+(i+1)+'</td><td>'+esc(x.n)+'</td><td class="c">'+esc(x.s)+'</td><td class="r">'+cv(x.a)+'</td><td class="r">'+cv(x.m)+'</td><td class="r">'+cv(x.k)+'</td></tr>'}).join('');
 $('paper').innerHTML='<div class="br">DEAR CROFFLE</div><h2>LAPORAN STOK BARANG</h2><div class="info"><div><span>Tanggal</span>: '+esc(tglID(r.tgl))+'</div><div><span>Cabang</span>: '+esc(r.cab||'-')+'</div></div>'+
 '<table class="rp"><thead><tr><th style="width:9mm">No</th><th>Nama Barang</th><th style="width:16mm">Satuan</th><th>Stok Awal</th><th>Stok Masuk</th><th>Stok Keluar</th></tr></thead><tbody>'+(rows||'<tr><td colspan="6" class="c">Tidak ada barang</td></tr>')+'</tbody></table>'}
function fit(){var p=$('paper');p.style.zoom=1;var w=p.offsetWidth,a=window.innerWidth-16;p.style.zoom=a<w?a/w:1}
function closeV(){$('vw').className='';$('vf').removeAttribute('src');if(blobUrl){URL.revokeObjectURL(blobUrl);blobUrl=''}curR=null}
function openV(r){
 curR=r;paperH(r);$('vT').textContent=r.cab+' · '+tglS(r.tgl);$('vN').style.display='none';
 if(blobUrl){URL.revokeObjectURL(blobUrl);blobUrl=''}
 $('vw').className='on';$('vw').scrollTop=0;fit();
 getPdf(r,function(url){
  if(curR!==r){if(url)URL.revokeObjectURL(url);return}
  blobUrl=url;
  if(url&&navigator.pdfViewerEnabled===true){$('vf').src=url;$('vw').className='on pdfm'}
  else if(!url){$('vN').textContent='File PDF belum tersedia untuk laporan ini, menampilkan tampilan tabel.';$('vN').style.display=''}
 })}
$('vK').onclick=closeV;
$('vD').onclick=function(){if(!curR)return;if(blobUrl)dl(blobUrl,curR);else toast('File PDF tidak tersedia. Gunakan Cetak.')};
$('vP').onclick=function(){try{window.print()}catch(e){toast('Cetak tidak didukung di sini')}};
window.addEventListener('resize',function(){if($('vw').className.indexOf('on')>=0)fit()});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&$('vw').className.indexOf('on')>=0)closeV()});

/* ----- Firebase ----- */
function start(){
 stop();
 unsubCb=db.collection('cabang').onSnapshot(function(s){CB=[];s.forEach(function(d){var c=d.data();if(c)CB.push(Object.assign({},c,{id:d.id}))});refresh()},function(){});
 unsub=db.collection('laporan').orderBy('saved','desc').onSnapshot(function(s){
  ALL=[];s.forEach(function(d){var r=d.data();if(r&&r.cabId&&r.tgl)ALL.push(r)});
  refresh()},
 function(e){
  var ng=e&&e.code==='permission-denied';
  $('grid').innerHTML='<div class="empty" style="grid-column:1/-1">'+(ng?'Akun ini tidak punya akses admin. Tambahkan email admin pada Rules Firestore (lihat petunjuk di kode file ini), atau <a href="index.html">buka aplikasi stok cabang</a>.':'Gagal memuat laporan ('+esc((e&&e.code)||'error')+').')+'</div>'})}
function stop(){if(unsub){try{unsub()}catch(e){}unsub=null}if(unsubCb){try{unsubCb()}catch(e){}unsubCb=null}}
function init(){
 if(typeof firebase==='undefined'){authDone=true;hideBoot();$('lg').className='ov on';$('lgEr').textContent='Gagal memuat Firebase. Periksa koneksi internet lalu muat ulang.';$('lgB').disabled=true;return}
 firebase.initializeApp(FIREBASE_CONFIG);auth=firebase.auth();db=firebase.firestore();
 try{auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(function(){})}catch(e){}
 auth.onAuthStateChanged(function(u){
  authDone=true;hideBoot();
  if(u){$('lg').className='ov';$('app').style.display='';$('usr').textContent=u.email||'';$('av').textContent=(u.email||'?').charAt(0).toUpperCase();renderHome();start()}
  else{stop();$('app').style.display='none';$('lg').className='ov on'}})}
function doLogin(){
 var e=$('lgE').value.trim(),p=$('lgP').value;if(!auth)return;
 if(!e||!p){$('lgEr').textContent='Isi email dan kata sandi.';return}
 var b=$('lgB');b.disabled=true;$('lgEr').textContent='';
 auth.signInWithEmailAndPassword(e,p).then(function(){b.disabled=false;$('lgP').value=''}).catch(function(x){b.disabled=false;var c=x&&x.code;
  $('lgEr').textContent=c==='auth/network-request-failed'?'Tidak ada koneksi internet.':c==='auth/too-many-requests'?'Terlalu banyak percobaan. Coba lagi nanti.':'Email atau kata sandi salah.'})}
$('lgB').onclick=doLogin;
$('lgP').addEventListener('keydown',function(e){if(e.key==='Enter')doLogin()});
$('bOut').onclick=function(ev){ev.preventDefault();stop();(auth?auth.signOut():Promise.resolve()).then(function(){location.reload()},function(){location.reload()})};
/* ----- kelola cabang ----- */
function openM(h){$('md').innerHTML=h;$('ov').className='ov on'}
function closeM(){$('ov').className='ov'}
$('ov').addEventListener('click',function(e){if(e.target===this)closeM()});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeM()});
function renderCbg(){
 var h=CB.slice().sort(function(a,b){return String(a.nama).localeCompare(String(b.nama),'id')}).map(function(c){var on=c.active!==false;
  return'<div class="hi" data-id="'+esc(c.id)+'"><div class="hn"><b>'+esc(c.nama)+'</b><small>'+esc(c.email||'')+'</small></div><span class="bd '+(on?'ok':'no')+'">'+(on?'Aktif':'Nonaktif')+'</span><div class="act"><button class="s" data-a="n">Ubah nama</button><button class="s" data-a="r">Reset sandi</button><button class="s" data-a="t">'+(on?'Nonaktifkan':'Aktifkan')+'</button><button class="s" data-a="h" style="color:var(--dg)">Hapus</button></div></div>'}).join('');
 $('cbl').innerHTML=h||'<div class="empty">Belum ada cabang. Tambahkan cabang pertama di atas.</div>'}
function createAcc(email,pw){
 var app2=firebase.initializeApp(FIREBASE_CONFIG,'sec'+Date.now()),a2=app2.auth();
 return a2.createUserWithEmailAndPassword(email,pw).then(function(c){var uid=c.user.uid;
  return a2.signOut().then(function(){return app2.delete()}).then(function(){return uid},function(){return uid})},
  function(e){try{app2.delete()}catch(x){}throw e})}
$('cB').onclick=function(){
 var n=$('cN').value.trim(),e=$('cE').value.trim(),p=$('cP').value;$('cEr').textContent='';$('cOk').innerHTML='';
 if(!n||!e||!p){$('cEr').textContent='Isi nama cabang, email, dan kata sandi.';return}
 if(p.length<6){$('cEr').textContent='Kata sandi minimal 6 karakter.';return}
 var b=this;b.disabled=true;b.textContent='Membuat akun…';
 createAcc(e,p).then(function(uid){
  return db.doc('cabang/'+uid).set({id:uid,uid:uid,nama:n.slice(0,80),email:e,active:true,created:Date.now()}).then(function(){
   $('cOk').innerHTML='<div class="ok2"><b>Cabang berhasil dibuat ✓</b><br>Cabang: '+esc(n)+'<br>Email: '+esc(e)+'<br>Kata sandi: '+esc(p)+'<br><span class="sub">Catat dan berikan ke petugas cabang. Kata sandi tidak ditampilkan lagi setelah ini.</span></div>';
   $('cN').value='';$('cE').value='';$('cP').value='';toast('Cabang dibuat ✓')},
  function(){$('cEr').textContent='Akun login dibuat, tetapi data cabang gagal disimpan. Periksa Rules Firestore (lihat petunjuk di kode file).'})})
 .catch(function(x){var c=x&&x.code;$('cEr').textContent=c==='auth/email-already-in-use'?'Email sudah dipakai akun lain.':c==='auth/invalid-email'?'Format email tidak valid.':c==='auth/weak-password'?'Kata sandi terlalu lemah.':c==='auth/operation-not-allowed'?'Metode Email/Password belum diaktifkan di Firebase Authentication.':'Gagal membuat akun ('+(c||'error')+').'})
 .then(function(){b.disabled=false;b.textContent='Buat Cabang & Akun'})};
$('cbl').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;
 var id=b.closest('.hi').getAttribute('data-id'),c=CB.filter(function(x){return x.id===id})[0],a=b.getAttribute('data-a');if(!c)return;
 if(a==='n'){openM('<h3>Ubah Nama Cabang</h3><div class="f"><label for="nn">Nama cabang</label><input id="nn" value="'+esc(c.nama)+'"></div><div class="er" id="ne"></div><div class="bt"><button id="mx">Batal</button><button class="p" id="mo">Simpan</button></div>');
  $('nn').focus();$('mx').onclick=closeM;
  $('mo').onclick=function(){var n=$('nn').value.trim();if(!n){$('ne').textContent='Nama wajib diisi.';return}
   db.doc('cabang/'+id).update({nama:n.slice(0,80)}).then(function(){closeM();toast('Nama diperbarui ✓')},function(){$('ne').textContent='Gagal menyimpan.'})}}
 else if(a==='r'){auth.sendPasswordResetEmail(c.email).then(function(){toast('Link reset sandi dikirim ke '+c.email)},function(){toast('Gagal mengirim link reset')})}
 else if(a==='t'){var on=c.active!==false;db.doc('cabang/'+id).update({active:!on}).then(function(){toast(on?'Cabang dinonaktifkan':'Cabang diaktifkan ✓')},function(){toast('Gagal mengubah status')})}
 else{openM('<h3>Hapus Cabang</h3><p>Hapus "'+esc(c.nama)+'"? Akun ini tidak akan bisa masuk lagi ke aplikasi stok. Laporan lama tetap tersimpan.</p><div class="bt"><button id="mx">Batal</button><button class="p" id="mo" style="background:var(--dg);border-color:var(--dg)">Ya, hapus</button></div>');
  $('mx').onclick=closeM;$('mo').onclick=function(){db.doc('cabang/'+id).delete().then(function(){closeM();toast('Cabang dihapus')},function(){closeM();toast('Gagal menghapus')})}}});
init();
})();
</script>
</body>
